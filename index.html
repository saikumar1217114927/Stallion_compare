<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stallion Core vs BSE 500</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1b1f24; --muted:#5f6b7a; --border:#e3e7ec;
    --accent:#1f6feb; --fund:#1f6feb; --bench:#e8833a; --pos:#13804a; --neg:#c62828; --tab:#eef1f5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1216; --card:#171b21; --text:#e6e9ee; --muted:#9aa5b4; --border:#2a3038;
      --accent:#4c8dff; --fund:#4c8dff; --bench:#f0a05a; --pos:#3fbf7f; --neg:#ff6b6b; --tab:#20262e;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:22px;margin:0}
  h2{font-size:15px;margin:0 0 10px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .tabs{display:flex;flex-wrap:wrap;background:var(--tab);border-radius:10px;padding:4px;gap:4px}
  .tabs button{border:0;background:transparent;color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
  .tabs button.active{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .range{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
  .range input,.range select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font:inherit}
  #amount{width:120px;font-weight:600}
  .range input:disabled{opacity:.55;cursor:not-allowed}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
  .stat .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .stat .v{font-size:24px;font-weight:700;margin-top:4px}
  .stat .s{font-size:13px}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  .chartbox{position:relative;height:340px}
  .legend{display:flex;gap:16px;font-size:13px;margin-bottom:8px;flex-wrap:wrap}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .tablewrap{overflow-x:auto;max-height:520px;overflow-y:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{position:sticky;top:0;background:var(--card);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  .note{font-size:12px;color:var(--muted)}
  .msg{padding:24px;text-align:center}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Stallion Core Fund vs BSE 500</h1>
  <div class="sub" id="dataInfo">Loading data…</div>

  <div class="card msg hidden" id="loadError">Data is not available right now. Please try again later.</div>

  <div id="app" class="hidden">
    <div class="card controls">
      <div class="tabs" id="tabs">
        <button data-p="week" class="active">Weekly</button>
        <button data-p="month">Monthly</button>
        <button data-p="year">Yearly (Calendar)</button>
        <button data-p="fy">Yearly (FY Apr–Mar)</button>
      </div>
      <div class="range">
        <label>Amount ₹ <input type="number" id="amount" value="100" min="1" step="any"></label>
        <select id="quick">
          <option value="all">Since inception</option>
          <option value="3m">Last 3 months</option>
          <option value="6m">Last 6 months</option>
          <option value="ytd">Year to date</option>
          <option value="1y">Last 1 year</option>
          <option value="3y">Last 3 years</option>
          <option value="custom">Custom dates</option>
        </select>
        <label>From <input type="date" id="fromDate" disabled></label>
        <label>To <input type="date" id="toDate" disabled></label>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="card">
      <h2 id="barTitle"></h2>
      <div class="legend">
        <span><span class="dot" style="background:var(--fund)"></span>Stallion Core</span>
        <span><span class="dot" style="background:var(--bench)"></span>BSE 500</span>
      </div>
      <div class="chartbox"><canvas id="barChart"></canvas></div>
    </div>

    <div class="card">
      <h2 id="tableTitle"></h2>
      <div class="tablewrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p class="note">Each row shows what the amount invested at the start of that period was worth at its end.
        * First period may be partial (measured from the first available NAV).</p>
    </div>
  </div>
</div>

<script>
// Excel file in the same repo folder as this page. To update data, replace it with the same name.
const DATA_FILE = 'data.xlsx';

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PERIOD_NAMES = { week:'Weekly', month:'Monthly', year:'Yearly (Calendar)', fy:'Yearly (FY Apr–Mar)' };
let ALL = [];          // [{d:Date, f:fund NAV, b:BSE 500}]
let period = 'week';
let barChart;

const $ = id => document.getElementById(id);

/* ---------- Loading ---------- */
async function load(){
  try{
    const res = await fetch(DATA_FILE + '?v=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    handleWorkbook(XLSX.read(await res.arrayBuffer(), {type:'array'}));
  }catch(e){
    console.error(e);
    showError();
  }
}
function showError(){
  $('app').classList.add('hidden');
  $('loadError').classList.remove('hidden');
  $('dataInfo').textContent = '';
}

/* ---------- Parsing ---------- */
function toDate(v){
  if(v == null || v === '') return null;
  if(v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if(typeof v === 'number'){
    const p = XLSX.SSF.parse_date_code(v);
    return p ? new Date(p.y, p.m - 1, p.d) : null;
  }
  const s = String(v).trim();
  let m;
  if((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return new Date(+m[1], +m[2]-1, +m[3]);
  if((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){           // dd-mm-yyyy
    let y = +m[3]; if(y < 100) y += 2000;
    return new Date(y, +m[2]-1, +m[1]);
  }
  if((m = s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3,})[-\/ ,]*(\d{2,4})/))){   // 14-Oct-2026
    const mi = MONTHS.findIndex(x => x.toLowerCase() === m[2].slice(0,3).toLowerCase());
    let y = +m[3]; if(y < 100) y += 2000;
    if(mi >= 0) return new Date(y, mi, +m[1]);
  }
  const t = Date.parse(s);
  if(!isNaN(t)){ const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  return null;
}
function toNum(v){
  if(typeof v === 'number') return v;
  if(v == null) return NaN;
  return parseFloat(String(v).replace(/[,₹\s]/g, ''));
}

// Find the sheet + header row that has the date and BSE 500 columns
function findTable(wb){
  let best = null;
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:''});
    for(let h = 0; h < Math.min(rows.length, 15); h++){
      const hdr = rows[h].map(c => String(c).toLowerCase().trim());
      if(hdr.some(c => c.includes('date')) && hdr.some(c => c.includes('bse') || c.includes('500'))){
        const n = rows.length - h - 1;
        if(!best || n > best.n) best = {rows, h, hdr, n};
        break;
      }
    }
  }
  return best;
}

function handleWorkbook(wb){
  const t = findTable(wb);
  if(!t) return showError();
  const {rows, h, hdr} = t;
  const isFund = c => c.includes('stallion') || c.includes('fund');
  const isBse = c => c.includes('bse') || c.includes('500');
  const find = fn => hdr.findIndex(fn);

  // Layout A: BSE Date | BSE 500 NAV | Stallion NAV Date | Stallion NAV
  let bd = find(c => isBse(c) && c.includes('date'));
  let bn = find(c => isBse(c) && !c.includes('date'));
  let sd = find(c => isFund(c) && c.includes('date'));
  let sn = find(c => isFund(c) && !c.includes('date'));
  // Layout B: Date | Stallion NAV | BSE 500 NAV
  if(bd < 0 || sd < 0){
    const cd = find(c => c.includes('date'));
    bd = sd = cd < 0 ? 0 : cd;
  }
  if(bn < 0) bn = 2;
  if(sn < 0) sn = 1;

  const bseMap = new Map(), fundMap = new Map();
  for(let i = h + 1; i < rows.length; i++){
    const r = rows[i];
    const d1 = toDate(r[bd]), v1 = toNum(r[bn]);
    if(d1 && isFinite(v1) && v1 > 0) bseMap.set(d1.getTime(), v1);
    const d2 = toDate(r[sd]), v2 = toNum(r[sn]);
    if(d2 && isFinite(v2) && v2 > 0) fundMap.set(d2.getTime(), v2);
  }

  // For each Stallion NAV date use the BSE 500 close of the same day,
  // or the latest earlier BSE close within 7 days.
  const bseDates = [...bseMap.keys()].sort((a, b) => a - b);
  const prevBse = t0 => {
    let lo = 0, hi = bseDates.length - 1, ans = -1;
    while(lo <= hi){ const m = (lo + hi) >> 1; if(bseDates[m] <= t0){ ans = m; lo = m + 1; } else hi = m - 1; }
    return ans < 0 ? null : bseDates[ans];
  };
  const out = [];
  for(const t0 of [...fundMap.keys()].sort((a, b) => a - b)){
    const p = bseMap.has(t0) ? t0 : prevBse(t0);
    if(p != null && (t0 - p) / 864e5 <= 7) out.push({d: new Date(t0), f: fundMap.get(t0), b: bseMap.get(p)});
  }
  ALL = out;
  if(ALL.length < 2) return showError();

  $('loadError').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('dataInfo').textContent = `NAV data from ${fmtDate(ALL[0].d)} to ${fmtDate(ALL[ALL.length-1].d)}`;
  const lo = isoStr(ALL[0].d), hi = isoStr(ALL[ALL.length-1].d);
  $('fromDate').value = $('fromDate').min = $('toDate').min = lo;
  $('toDate').value = $('fromDate').max = $('toDate').max = hi;
  render();
}

/* ---------- Helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const isoStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDate = d => `${pad(d.getDate())}-${MONTHS[d.getMonth()]}-${d.getFullYear()}`;
const fmtRs = n => '₹' + n.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtPct = (x, pp) => (x >= 0 ? '+' : '') + (x * 100).toFixed(2) + (pp ? ' pp' : '%');
const cls = x => x >= 0 ? 'pos' : 'neg';
const amount = () => { const a = parseFloat($('amount').value); return isFinite(a) && a > 0 ? a : 100; };

function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
  return `${y}-W${pad(w)}`;
}
function keyOf(d, p){
  if(p === 'week') return isoWeek(d);
  if(p === 'month') return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  if(p === 'year') return String(d.getFullYear());
  return String(d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1);
}
function labelOf(key, last, p){
  if(p === 'week') return `Wk ending ${fmtDate(last.d)}`;
  if(p === 'month') return `${MONTHS[last.d.getMonth()]} ${last.d.getFullYear()}`;
  if(p === 'year') return key;
  return `FY ${key}-${String(+key + 1).slice(2)}`;
}

function filtered(){
  const from = $('fromDate').value ? new Date($('fromDate').value + 'T00:00:00') : ALL[0].d;
  const to = $('toDate').value ? new Date($('toDate').value + 'T00:00:00') : ALL[ALL.length-1].d;
  return ALL.filter(r => r.d >= from && r.d <= to);
}

// Return of each period = last NAV of the period vs last NAV of the previous period
function periodRows(data, p){
  const groups = [];
  let cur = null;
  for(const r of data){
    const k = keyOf(r.d, p);
    if(!cur || cur.key !== k){ cur = {key:k, items:[]}; groups.push(cur); }
    cur.items.push(r);
  }
  const out = [];
  let prev = null;
  for(const g of groups){
    const last = g.items[g.items.length - 1];
    const base = prev || g.items[0];
    if(!prev && g.items.length < 2){ prev = last; continue; }
    const fr = last.f / base.f - 1, br = last.b / base.b - 1;
    out.push({label: labelOf(g.key, last, p) + (prev ? '' : ' *'), fr, br, diff: fr - br});
    prev = last;
  }
  return out;
}

/* ---------- Rendering ---------- */
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function render(){
  const data = filtered();
  const amt = amount();
  const name = PERIOD_NAMES[period];
  $('barTitle').textContent = `${name}: value of ${fmtRs(amt)} invested at the start of each period`;
  $('tableTitle').textContent = `${name} comparison`;

  if(data.length < 2){
    $('stats').innerHTML = '<div class="stat"><div class="k">Not enough data</div><div class="s">Pick a wider date range.</div></div>';
    $('tbody').innerHTML = '';
    if(barChart){ barChart.destroy(); barChart = null; }
    return;
  }
  const rows = periodRows(data, period);
  renderStats(data, rows, amt);
  renderTable(rows, amt);
  renderChart(rows, amt);
}

function renderStats(data, rows, amt){
  const a = data[0], z = data[data.length - 1];
  const fT = z.f / a.f - 1, bT = z.b / a.b - 1;
  const wins = rows.filter(r => r.diff >= 0).length;
  const unit = {week:'weeks', month:'months', year:'years', fy:'years'}[period];
  const card = (k, v, s, c) => `<div class="stat"><div class="k">${k}</div><div class="v ${c || ''}">${v}</div><div class="s">${s}</div></div>`;
  $('stats').innerHTML =
    card(`${fmtRs(amt)} in Stallion Core`, fmtRs(amt * (1 + fT)), `<span class="${cls(fT)}">${fmtPct(fT)}</span> · ${fmtDate(a.d)} to ${fmtDate(z.d)}`, cls(fT)) +
    card(`${fmtRs(amt)} in BSE 500`, fmtRs(amt * (1 + bT)), `<span class="${cls(bT)}">${fmtPct(bT)}</span> · ${fmtDate(a.d)} to ${fmtDate(z.d)}`, cls(bT)) +
    card('Stallion vs BSE 500', (fT >= bT ? '+' : '−') + fmtRs(Math.abs(amt * (fT - bT))),
      `<span class="${cls(fT - bT)}">${fmtPct(fT - bT, true)}</span> · ahead in ${wins} of ${rows.length} ${unit}`, cls(fT - bT));
}

function renderTable(rows, amt){
  $('thead').innerHTML = `<tr><th>Period</th><th>Stallion Return</th><th>${fmtRs(amt)} → Stallion</th>
    <th>BSE 500 Return</th><th>${fmtRs(amt)} → BSE 500</th><th>Difference</th></tr>`;
  $('tbody').innerHTML = rows.slice().reverse().map(r => `
    <tr>
      <td>${r.label}</td>
      <td class="${cls(r.fr)}">${fmtPct(r.fr)}</td><td>${fmtRs(amt * (1 + r.fr))}</td>
      <td class="${cls(r.br)}">${fmtPct(r.br)}</td><td>${fmtRs(amt * (1 + r.br))}</td>
      <td class="${cls(r.diff)}"><b>${fmtPct(r.diff, true)}</b></td>
    </tr>`).join('');
}

function renderChart(rows, amt){
  const fund = css('--fund'), bench = css('--bench'), grid = css('--border'), muted = css('--muted');
  Chart.defaults.color = muted;
  Chart.defaults.font.family = 'system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif';
  const fv = rows.map(r => +(amt * (1 + r.fr)).toFixed(2));
  const bv = rows.map(r => +(amt * (1 + r.br)).toFixed(2));
  // Zoom the axis around the invested amount so small differences are visible
  const all = fv.concat(bv, [amt]);
  const lo = Math.min(...all), hi = Math.max(...all), padY = (hi - lo) * 0.1 || amt * 0.01;

  if(barChart) barChart.destroy();
  barChart = new Chart($('barChart'), {
    type: 'bar',
    data: {
      labels: rows.map(r => r.label.replace('Wk ending ', '')),
      datasets: [
        {label:'Stallion Core', data: fv, backgroundColor: fund, base: amt},
        {label:'BSE 500', data: bv, backgroundColor: bench, base: amt}
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: {mode: 'index', intersect: false},
      plugins: {legend: {display: false}, tooltip: {callbacks: {label: c => {
        const r = rows[c.dataIndex], ret = c.datasetIndex === 0 ? r.fr : r.br;
        return `${c.dataset.label}: ${fmtRs(c.parsed.y)} (${fmtPct(ret)})`;
      }}}},
      scales: {x: {ticks: {maxTicksLimit: 12, autoSkip: true}, grid: {display: false}},
               y: {min: Math.max(0, lo - padY), max: hi + padY, grid: {color: grid},
                   ticks: {callback: v => '₹' + v.toLocaleString('en-IN')}}}
    }
  });
}

/* ---------- Controls ---------- */
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b));
  period = b.dataset.p;
  render();
});
$('amount').addEventListener('input', render);
$('fromDate').addEventListener('change', render);
$('toDate').addEventListener('change', render);
$('quick').addEventListener('change', () => {
  if(!ALL.length) return;
  const last = ALL[ALL.length - 1].d, v = $('quick').value;
  // Dates are editable only with "Custom dates"; presets fill them in
  $('fromDate').disabled = $('toDate').disabled = v !== 'custom';
  if(v === 'custom') return;
  let from = new Date(ALL[0].d);
  const back = m => { const d = new Date(last); d.setMonth(d.getMonth() - m); return d; };
  if(v === '3m') from = back(3);
  else if(v === '6m') from = back(6);
  else if(v === '1y') from = back(12);
  else if(v === '3y') from = back(36);
  else if(v === 'ytd') from = new Date(last.getFullYear(), 0, 1);
  if(from < ALL[0].d) from = ALL[0].d;
  $('fromDate').value = isoStr(from);
  $('toDate').value = isoStr(last);
  render();
});

load();
</script>
</body>
</html>
